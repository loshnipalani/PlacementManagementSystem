services:

  mysql:
    image: mysql:8.0
    container_name: placement-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: placement_db

    ports:
      - "3307:3306"

    volumes:
      - placement_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: placement-app

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_PASSWORD: root
      DB_HOST: mysql

    ports:
      - "8081:8081"

volumes:
  placement_mysql_data: